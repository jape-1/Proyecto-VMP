[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vmp-ia-service"
version = "0.1.0"
description = "Servicio de IA del estacionamiento VMP: detector YOLO26 y comparador de semejanza"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "pillow>=10.3",
    "ultralytics>=8.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Las herramientas de entrenamiento son guiones sueltos, aún sin pruebas ni estilo (training/LEEME.md).
extend-exclude = ["training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lenta: usa los pesos reales (best.pt y la red del comparador); no corre por defecto",
]
addopts = "-m 'not lenta'"
filterwarnings = ["ignore::DeprecationWarning"]
